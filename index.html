<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>onefile-worlds</title>
<meta name="description" content="Real-time WebGPU worlds, each in a single HTML file. No engine, no build step.">
<meta property="og:title" content="onefile-worlds">
<meta property="og:description" content="Real-time WebGPU worlds, each in a single HTML file.">
<meta property="og:image" content="orbit-to-abyss/thumb.jpg">
<style>
  :root { --bg: #05080c; --panel: #0b131b; --line: rgba(255,255,255,.12); --fg: #eaf2f7; --dim: #9fb2c0; --acc: #7fd3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 56px 20px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 40px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); font-weight: 600; letter-spacing: -.02em; }
  .lede { margin: 8px 0 0; color: var(--dim); max-width: 620px; }
  .rules { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding: 0; list-style: none; }
  .rules li { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .lang { display: flex; gap: 4px; }
  .lang button { height: 36px; min-width: 44px; border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 8px; font: 500 13px inherit; cursor: pointer; }
  .lang button.on { color: var(--acc); border-color: var(--acc); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; transition: border-color .2s, transform .2s; }
  .card:hover, .card:focus-within { border-color: var(--acc); transform: translateY(-2px); }
  .card a:focus-visible { outline: none; }
  .thumb { position: relative; }
  .size { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 10px;
    background: rgba(5,8,12,.78); border: 1px solid rgba(127,211,255,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .size b { font: 600 22px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--acc); letter-spacing: -.01em; }
  .size span { font-size: 11px; letter-spacing: .06em; color: var(--dim); }
  .stats { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 22px; }
  .stats div { display: flex; flex-direction: column; }
  .stats b { font: 600 34px/1.05 ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg); letter-spacing: -.02em; }
  .stats b.acc { color: var(--acc); }
  .stats span { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-top: 4px; }
  .card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: #0e1a24; }
  .card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
  .card h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .card p { margin: 0; color: var(--dim); font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tags span { font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .soon { display: flex; align-items: center; justify-content: center; min-height: 240px; border: 1px dashed var(--line); border-radius: 14px; color: var(--dim); text-align: center; padding: 24px; text-decoration: none; line-height: 1.5; transition: border-color .2s, color .2s; }
  .soon:hover, .soon:focus-visible { border-color: var(--acc); color: var(--fg); outline: none; }
  .soon strong { color: var(--fg); font-size: 18px; font-weight: 600; }
  .by { margin-top: auto; padding-top: 10px; font-size: 13px; color: var(--dim); }
  .by a { color: var(--acc); text-decoration: none; }
  .by a:hover { text-decoration: underline; }
  .card .body { flex: 1; }
  .note { margin-top: 40px; color: var(--dim); font-size: 14px; }
  .note a { color: var(--acc); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="mono">onefile-worlds</h1>
      <p class="lede" data-en="Real-time worlds rendered with WebGPU, each one a single HTML file you can double-click. No engine, no libraries, no build step." data-tr="WebGPU ile gerçek zamanlı çizilen dünyalar; her biri çift tıklayıp açabileceğin tek bir HTML dosyası. Motor yok, kütüphane yok, derleme adımı yok."></p>
      <div class="stats" aria-label="Blue Planet in numbers">
        <div><b class="acc mono" id="statKB">186 KB</b><span data-en="the whole planet" data-tr="gezegenin tamamı"></span></div>
        <div><b class="mono" id="statGz">59 KB</b><span data-en="download (gzip)" data-tr="indirme (gzip)"></span></div>
        <div><b class="mono">1</b><span data-en="HTML file" data-tr="HTML dosyası"></span></div>
        <div><b class="mono">0</b><span data-en="dependencies" data-tr="bağımlılık"></span></div>
      </div>
      <ul class="rules">
        <li data-en="One file" data-tr="Tek dosya"></li>
        <li data-en="No engine" data-tr="Motor yok"></li>
        <li>WebGPU + WGSL</li>
        <li>EN / TR</li>
      </ul>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-set="en">EN</button><button data-set="tr">TR</button>
    </div>
  </header>

  <main class="grid" id="grid">
    <a class="soon" id="addCard" href="https://github.com/sahmett/onefile-worlds#contributing">
      <span><strong data-en="Add your world" data-tr="Kendi dünyanı ekle"></strong><br><span data-en="One HTML file, no engine. See how to contribute →" data-tr="Tek HTML dosyası, motor yok. Nasıl katkı verilir →"></span></span>
    </a>
  </main>

  <!-- The list of worlds. To add yours, append one entry (see CONTRIBUTING.md). -->
  <script type="application/json" id="worlds">
[
  {
    "id": "orbit-to-abyss",
    "title": { "en": "Blue Planet — Orbit to Abyss", "tr": "Blue Planet — Yörüngeden Abise" },
    "description": {
      "en": "Fall from orbit through the atmosphere and clouds, onto the waves, over a coral reef and down a reef wall to hydrothermal vents 3,400 m deep.",
      "tr": "Yörüngeden atmosfer ve bulutların arasından dalgalara, mercan resifinin üstünden resif duvarı boyunca 3.400 m derindeki hidrotermal bacalara in."
    },
    "alt": { "en": "Sunset over FFT-simulated ocean waves", "tr": "FFT ile simüle edilen okyanus dalgalarında gün batımı" },
    "tags": ["FFT ocean", "volumetric clouds", "atmosphere", "underwater optics", "procedural audio"],
    "author": "Seyyit Ahmet Kılıç",
    "github": "sahmett",
    "size": { "bytes": 185574, "gzip": 59000 }
  }
]
  </script>

  <p class="note" data-en-html="Needs a browser with WebGPU (recent Chrome or Edge; Safari 26+) and a reasonably capable GPU. Source on &lt;a href=&quot;https://github.com/sahmett/onefile-worlds&quot;&gt;GitHub&lt;/a&gt;." data-tr-html="WebGPU destekleyen bir tarayıcı (güncel Chrome veya Edge; Safari 26+) ve makul bir ekran kartı gerekir. Kaynak kod &lt;a href=&quot;https://github.com/sahmett/onefile-worlds&quot;&gt;GitHub&lt;/a&gt;’da."></p>
</div>
<script>
  // language: EN by default, remembered per browser (shared with the worlds)
  let lang = 'en';
  try { const v = localStorage.getItem('bp.lang'); if (v === 'tr' || v === 'en') lang = v; } catch (e) { /* storage unavailable */ }
  // cards are built from the JSON list with textContent only (contributed text is never parsed as HTML)
  const worlds = JSON.parse(document.getElementById('worlds').textContent);
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  const kb = b => b ? Math.round(b / 1000).toLocaleString(lang === 'tr' ? 'tr-TR' : 'en-US') + ' KB' : '—';
  // measure the real file sizes when served over http(s): raw bytes and gzip via CompressionStream
  async function measure(w) {
    try {
      const txt = await (await fetch(w.id + '/index.html', { cache: 'no-store' })).blob();
      const gz = 'CompressionStream' in window ? await new Response(txt.stream().pipeThrough(new CompressionStream('gzip'))).blob() : null;
      w.size = { bytes: txt.size, gzip: gz ? gz.size : (w.size && w.size.gzip) };
    } catch (e) { /* file:// or offline: keep the listed sizes */ }
  }
  function renderCards() {
    const grid = document.getElementById('grid'), add = document.getElementById('addCard');
    grid.querySelectorAll('.card').forEach(c => c.remove());
    for (const w of worlds) {
      const pick = o => (o && (o[lang] || o.en)) || '';
      const card = el('div', 'card');
      const link = el('a'); link.href = w.id + '/'; link.style.cssText = 'display: contents; color: inherit; text-decoration: none';
      const img = el('img'); img.src = w.id + '/thumb.jpg'; img.alt = pick(w.alt); img.width = 960; img.height = 540; img.loading = 'lazy';
      const body = el('div', 'body');
      body.append(el('h2', null, pick(w.title)), el('p', null, pick(w.description)));
      const tags = el('div', 'tags'); for (const tg of w.tags || []) tags.append(el('span', null, tg)); body.append(tags);
      const thumb = el('div', 'thumb'); thumb.append(img);
      const badge = el('div', 'size'); badge.dataset.world = w.id;
      badge.append(el('b', null, kb(w.size && w.size.bytes)), el('span', null, (lang === 'tr' ? 'tek dosya · ' : 'one file · ') + kb(w.size && w.size.gzip) + (lang === 'tr' ? ' indirme' : ' download')));
      thumb.append(badge);
      link.append(thumb, body);
      const by = el('div', 'by'); by.append(document.createTextNode((lang === 'tr' ? 'Yazar: ' : 'By ') + w.author + ' · '));
      const gh = el('a', null, '@' + w.github); gh.href = 'https://github.com/' + encodeURIComponent(w.github); by.append(gh);
      const wrap = el('div', 'body'); wrap.style.paddingTop = '0'; wrap.append(by);
      card.append(link, wrap);
      card.tabIndex = -1;
      grid.insertBefore(card, add);
    }
  }
  function apply() {
    renderCards();
    const f = worlds[0];
    if (f && f.size) { document.getElementById('statKB').textContent = kb(f.size.bytes); document.getElementById('statGz').textContent = kb(f.size.gzip); }
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.dataset[lang]; });
    document.querySelectorAll('[data-en-html]').forEach(el => { el.innerHTML = lang === 'tr' ? el.dataset.trHtml : el.dataset.enHtml; });
    document.querySelectorAll('[data-set]').forEach(b => b.classList.toggle('on', b.dataset.set === lang));
  }
  document.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
    lang = b.dataset.set; try { localStorage.setItem('bp.lang', lang); } catch (e) { /* storage unavailable */ }
    apply();
  });
  apply();
  if (location.protocol.startsWith('http')) Promise.all(worlds.map(measure)).then(apply);
</script>
</body>
</html>
