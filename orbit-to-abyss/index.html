<title>Blue Planet — From Orbit to Abyss</title>

  Blue Planet — From Orbit to Abyss
  Tek dosya, motor yok: WebGPU + WGSL. Uzaydan okyanusun dibine kesintisiz, prosedürel bir deneyim.
  Dalga spektrumu (JONSWAP + Donelan-Banner, kılcal dağılım) ve LEAN eğim momentleri fikri

<style>

  * { box-sizing: border-box; }

  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }

  #gauge .tick::after { content: ""; position: absolute; right: -8px; top: 50%; width: 5px; height: 1px; background: var(--line); }
  #gauge .mark { position: absolute; right: -5px; width: 13px; height: 13px; border-radius: 50%; transform: translateY(-50%);
    background: var(--acc); box-shadow: 0 0 12px var(--acc); transition: top .08s linear; }
  #readout { position: fixed; right: 22px; bottom: calc(50% - min(31vh, 280px) - 46px); text-align: right; font-variant-numeric: tabular-nums; }

  .hb:hover { background: rgba(20,32,44,.9); }

  .hb.icon { width: 44px; padding: 0; justify-content: center; }

  .pop { position: fixed; left: 50%; bottom: 92px; transform: translate(-50%, 8px); width: min(420px, calc(100vw - 24px)); box-sizing: border-box; padding: 16px;
    border-radius: 14px; background: rgba(6,12,18,.92); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 4; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 120px); overflow-y: auto; }
  .pop.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

<script type="module">
// ============================================================================================
//  WGSL
// ============================================================================================
const STRUCT_U = /* wgsl */`
struct U {
  rightW: vec4f, upCW: vec4f, fwdW: vec4f,
  upW: vec4f, eastW: vec4f, northW: vec4f,
  sunW: vec4f,
  rightL: vec4f, upCL: vec4f, fwdL: vec4f,
  sunL: vec4f,
  camL: vec4f,
  cas: array<vec4f, 6>,
  proj: vec4f,
  res: vec4f,
  planet: vec4f,
  water: vec4f,
  misc: vec4f,
  extra: vec4f,
};
struct Fish { p: vec4f, v: vec4f };
const PI = 3.14159265359;
const RG = 6360000.0;
const RT = 6460000.0;
const HA = 100000.0;
const CB = 1600.0;
const CT = 4600.0;
`;

const NOISE = /* wgsl */`
fn pcg(v: u32) -> u32 { let s = v * 747796405u + 2891336453u; let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
fn h2(i: vec2i) -> u32 { return pcg(bitcast<u32>(i.x) ^ pcg(bitcast<u32>(i.y) + 0x9e3779b9u)); }
fn h3(i: vec3i) -> u32 { return pcg(bitcast<u32>(i.x) ^ pcg(bitcast<u32>(i.y) ^ pcg(bitcast<u32>(i.z) + 0x632be5abu))); }
fn uf(h: u32) -> f32 { return f32(h >> 8u) * (1.0 / 16777216.0); }
fn hash21(i: vec2i) -> f32 { return uf(h2(i)); }
fn hash22(i: vec2i) -> vec2f { let a = h2(i); return vec2f(uf(a), uf(pcg(a))); }
fn hash31(i: vec3i) -> f32 { return uf(h3(i)); }
fn hash33(i: vec3i) -> vec3f { let a = h3(i); let b = pcg(a); return vec3f(uf(a), uf(b), uf(pcg(b))); }
fn gn2(p: vec2f) -> f32 {
  let i = vec2i(floor(p)); let f = fract(p);
  let w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = dot(hash22(i) * 2.0 - 1.0, f);
  let b = dot(hash22(i + vec2i(1, 0)) * 2.0 - 1.0, f - vec2f(1.0, 0.0));

    for (var k = 0; k < 2; k++) { d = max(-terrSample(wxz + rd.xz * (d / mu)).x, 0.3); }

  }
  let tF = floorD / mu;
  var L = inscatter(vec3f(0.0, -0.01, 0.0), rd, min(tF, 500.0), w, 1.0);
  if (floorD < 70.0) {
    let fp = wxz + rd.xz * tF;
    let sunZ = w.sun0 * exp(-KD * floorD * w.kS);
    let ambZ = w.amb0 * exp(-KD * floorD);
    let ps = fp + w.sunU.xz * (floorD / w.sunU.y);
    let caus = mix(1.0, 0.25 + 2.3 * caustic(ps * 0.6, u.misc.x * 1.1), exp(-floorD / 22.0));
    let ts = terrSample(fp);
    let alb = mix(vec3f(0.66, 0.60, 0.46), vec3f(0.78, 0.42, 0.40), saturate(ts.y * 0.55));
    L += alb / PI * (sunZ * max(-w.sunU.y, 0.0) * caus + ambZ * 0.8) * exp(-SIG_T * tF);

fn lampIrr(lv: vec3f) -> vec3f {

fn caustic(p: vec2f, t: f32) -> f32 {

const TERR_SAMPLE = /* wgsl */`

const MID_SPAN = 8192.0;
const FAR_SPAN = 32768.0;
fn terrSample(xz: vec2f) -> vec4f {

const CORAL = /* wgsl */`
fn vor1(p: vec2f) -> vec2f {
  let ip = vec2i(floor(p)); let fp = fract(p);
  var best = 9.0; var id = 0.0;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      let c = ip + vec2i(x, y);
      let o = hash22(c + vec2i(5, 9));
      let d = length(vec2f(f32(x), f32(y)) + o - fp);
      if (d < best) { best = d; id = o.x; }
    }
  }
  return vec2f(best, id);
}
// x: height, y: coral weight, z: hue, w: kind
fn coral(xz: vec2f) -> vec4f {
  let p = xz / 2.4;
  let ip = vec2i(floor(p)); let fp = fract(p);
  var best = 9.0; var bid = vec2i(0);
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      let c = ip + vec2i(x, y);
      let o = hash22(c) * 0.8 + 0.1;
      let d = length(vec2f(f32(x), f32(y)) + o - fp);
      if (d < best) { best = d; bid = c; }
    }
  }
  let hs = hash22(bid + vec2i(91, 17));
  let hs2 = hash22(bid + vec2i(13, 77));
  let rad = 0.42 + 0.42 * hs.x;
  let x = best / rad;
  if (x >= 1.0 || hs.y < 0.18) { return vec4f(0.0, 0.0, hs2.x, 0.0); }
  var hgt = 0.0;
  let kind = hs2.y;
  if (kind < 0.26) {            // brain / boulder
    let dome = sqrt(max(1.0 - x * x, 0.0)) * (0.55 + 1.2 * hs.x);
    let g = abs(sin(gn2(xz * 1.6 + vec2f(hs.x * 9.0, 0.0)) * 8.0));
    hgt = dome - 0.06 * smoothstep(0.6, 1.0, g) * smoothstep(1.0, 0.7, x);
  } else if (kind < 0.48) {     // staghorn: finger-like branches
    let v = vor1(xz * 4.2);
    hgt = pow(max(1.0 - x, 0.0), 0.4) * (0.45 + 1.1 * hs.x) * (0.55 + 0.45 * v.y) * smoothstep(0.62, 0.18, v.x);
    hgt = max(hgt, 0.12 * (1.0 - x));
  } else if (kind < 0.66) {     // table coral
    hgt = smoothstep(1.0, 0.9, x) * (0.8 + 0.7 * hs.x) * (1.0 + 0.12 * x);
  } else if (kind < 0.84) {     // tube sponges
    let v = vor1(xz * 2.2 + hs * 7.0);
    let tube = smoothstep(0.42, 0.3, v.x) * (0.7 + 1.4 * v.y) * (1.0 - 0.4 * x);
    hgt = tube - smoothstep(0.17, 0.1, v.x) * tube * 0.5;
  } else {                      // soft coral mound
    hgt = pow(max(1.0 - x, 0.0), 0.6) * (0.4 + 0.6 * hs.x) * (0.75 + 0.5 * (gn2(xz * 3.1) * 0.5 + 0.5));
  }
  return vec4f(max(hgt, 0.0), smoothstep(1.0, 0.82, x), hs2.x, kind);
}
`;
const TERRAIN_FN = /* wgsl */`
fn terrainFn(xz: vec2f, texel: f32) -> vec3f {
  let warp = vec2f(fbm2(xz * 0.003, 3), fbm2(xz * 0.003 + vec2f(31.7, 7.1), 3)) * 90.0;
  let r = length(xz + warp);
  let r0 = length(xz);
  var h = -14.0 + 4.0 * fbm2(xz * 0.012, 3);
  h = mix(h, -48.0 + 10.0 * fbm2(xz * 0.006 + 5.0, 3), smoothstep(250.0, 430.0, r));
  h = mix(h, -1150.0 + 90.0 * fbm2(xz * 0.004 + 9.0, 3), smoothstep(450.0, 700.0, r));
  h = mix(h, -3750.0 + 80.0 * fbm2(xz * 0.0012 + 3.0, 3), smoothstep(900.0, 3700.0, r));
  let octs = i32(clamp(log2(0.5 / (texel * 0.08)), 1.0, 6.0));
  let rough = mix(0.5, 3.5, smoothstep(250.0, 600.0, r)) * mix(1.0, 0.5, smoothstep(1500.0, 3500.0, r));
  h += fbm2(xz * 0.08 + 17.0, octs) * rough;
  let wallW = smoothstep(430.0, 520.0, r) * (1.0 - smoothstep(800.0, 1000.0, r));
  h += wallW * sin(h * 0.06 + fbm2(xz * 0.01, 2) * 3.0) * 7.0;
  var cw = 0.0; var hue = 0.0;
  if (r0 < 300.0 && texel < 1.0) {
    cw = smoothstep(-0.3, 0.1, fbm2(xz * 0.025 + 3.3, 3)) * (1.0 - smoothstep(230.0, 295.0, r0));
  }
  return vec3f(h, cw, hue);
}
`;

// ------------------------------------------------------------- space / sky / far planet
fn stars(d: vec3f) -> vec3f {
  let p = d * 330.0;
  let i = vec3i(floor(p));
  let hh = hash33(i);
  var c = vec3f(0.0);
  if (hh.x > 0.982) {
    let ctr = (vec3f(i) + 0.2 + 0.6 * hash33(i + vec3i(7, 7, 7))) / 330.0;
    let a = length(normalize(ctr) - d) * 330.0;

fn skyApprox(rz: f32, muS: f32, cs: f32) -> vec3f {

  c += vec3f(0.3, 0.12, 0.04) * pow(saturate(cs), 6.0) * (1.0 - smoothstep(0.0, 0.3, muS)) * smoothstep(-0.15, 0.0, muS);

fn planetSurface(d: vec3f, tG: f32, h: f32, up: vec3f) -> vec3f {

  let sun = u.sunW.xyz;
  let sunP = planetDir(sun);

  let lowAlt = h < 80000.0;

    let snow = smoothstep(1.12 - elev * 1.5, 1.2 - elev * 1.5, abs(lat)) + smoothstep(0.3, 0.38, elev);

const HC = 8800.0;
// thin, fibrous high cloud deck: returns premultiplied colour and coverage
fn cirrus(h: f32, mu: f32, up: vec3f, d: vec3f, tLimit: f32) -> vec4f {
  let r = rsph(h, mu, HC);
  let t = select(r.x, r.y, h < HC);
  if (t <= 0.0 || t > tLimit) { return vec4f(0.0); }
  let pw = up * (RG + h) + d * t;
  let pp = planetDir(pw);
  let wind = normalize(vec3f(0.8, 0.0, 0.6));
  var q = pp / 30000.0;
  q -= wind * dot(q, wind) * 0.88;                     // stretch features along the wind
  let drift = vec3f(u.misc.x * 0.0004, 0.0, u.misc.x * 0.0002);
  let n1 = textureSampleLevel(noiseTex, sRep, q + drift, 0.0).b;
  let n2 = textureSampleLevel(noiseTex, sRep, q * 3.3 + drift * 2.0, 0.0).g;
  let n3 = textureSampleLevel(noiseTex, sRep, q * 9.1 + drift * 3.0, 0.0).r;
  let big = textureSampleLevel(mapTex, sMix, mapUV(normalize(pp)) + vec2f(0.37, 0.11), 0.0).g;
  var dens = smoothstep(0.42, 0.9, n1 * 0.65 + n2 * 0.35 + (n3 - 0.5) * 0.25) * smoothstep(0.42, 0.6, big + (u.misc.z - 0.5) * 0.3);

  if (dens < 0.002) { return vec4f(0.0); }
  let sun = u.sunW.xyz;
  let muS = clamp(dot(normalize(pw), sun), -1.0, 1.0);
  let nu = dot(d, sun);
  let sunC = (SUN_E0 * u.extra.x) * sunTrans(HC, muS);
  let ph = 0.55 * hg(nu, 0.78) + 0.45 * hg(nu, 0.1);   // bright silver lining toward the sun
  let amb = (SUN_E0 * u.extra.x) * vec3f(0.05, 0.075, 0.12) * smoothstep(-0.12, 0.35, muS);
  let a = dens * 0.6;
  return vec4f((sunC * ph * 2.2 + amb) * a, a);
}

// ------------------------------------------------------------- near ocean mesh (above water)
const SEGS = 512u;
struct MO { @builtin(position) pos: vec4f, @location(0) rel: vec3f, @location(1) o: vec2f, @location(2) crest: f32, @location(3) r: f32 };
fn ringRadius(i: u32) -> f32 { if (i == 0u) { return 0.0; } return 0.3 * pow(1.016, f32(i - 1u)); }
@vertex fn vsMesh(@builtin(vertex_index) vid: u32) -> MO {
  let ring = vid / SEGS; let seg = vid % SEGS;

  let r = ringRadius(ring);
  let o = vec2f(cos(ang), sin(ang)) * r;
  let spacing = max(r * 0.0125, 0.01);
  var disp = vec3f(0.0);
  for (var c = 0; c < 6; c++) {
    let cs = u.cas[c];
    let w = 1.0 - smoothstep(cs.z * 5.0, cs.z * 18.0, r);
    if (w > 0.0) {
      let lod = clamp(log2(spacing * 256.0 / cs.z), 0.0, 8.0);
      let A = textureSampleLevel(oceanTex, sRep, (cs.xy + o) / cs.z, c * 3, lod);
      disp += A.xyz * w;

  let rel = vec3f(o.x + disp.x, disp.y + curv - u.camL.y, o.y + disp.z);
  var out: MO;
  out.pos = projL(rel);
  out.rel = rel; out.o = o; out.crest = disp.y; out.r = r;
  return out;
}
fn shallowAt(o: vec2f) -> f32 {
  let xz = u.camL.xz + o;
  if (max(abs(xz.x), abs(xz.y)) > MID_SPAN * 0.47) { return 0.0; }
  let hT = terrSample(xz).x;

// Near sea. Surface statistics, glitter and reflection come from the shared sea model; the water's
// own colour is not a constant but the upwelling light of the underwater optics (seaBody), so deep
// water, the reef seen from above and the view after diving all come from one model.
// (Smith masking, visible-facet reflection tilt and cat's-paw gusts follow Noniv/web-ocean, MIT.)
@fragment fn fsMesh(in: MO, @builtin(front_facing) ff: bool) -> @location(0) vec4f {
  let xz = in.o;
  let wpos = u.camL.xz + in.o;
  let tt = u.misc.x;
  let wd = vec2f(cos(0.55), sin(0.55));
  let gustN = textureSample(foamLace, sRep, wpos * 0.011 + wd * (tt * 0.0004)).b;
  let gust = mix(0.35, 1.2, smoothstep(0.3, 0.72, gustN));
  let gx = dpdx(xz); let gy = dpdy(xz);
  var os = sampleOceanG(xz, gx, gy, gust, 6);
  let dist = length(in.rel);
  let V = -in.rel / max(dist, 1e-3);
  let Ld = u.sunL.xyz;
  os.cov += vec3f(0.0035, 0.0035, 0.0) * smoothstep(30.0, 500.0, dist);
  // specular anti-aliasing: slope change across the pixel widens the lobe
  let dsx = dpdx(os.s); let dsy = dpdy(os.s);
  let aa = vec3f(dsx.x * dsx.x + dsy.x * dsy.x, dsx.y * dsx.y + dsy.y * dsy.y, dsx.x * dsx.y + dsy.x * dsy.y) * 0.5;
  os.cov += aa * min(1.0, 0.03 / max(max(aa.x, aa.y), 1e-8));
  let nrm = normalize(vec3f(-os.s.x, 1.0, -os.s.y));
  let pw = u.upW.xyz * RG + u.eastW.xyz * xz.x + u.northW.xyz * xz.y;
  let sunE = (SUN_E0 * u.extra.x) * sunTrans(0.0, Ld.y) * cloudShadow(planetDir(normalize(pw)), planetDir(u.sunW.xyz));
  let amb = skyAmb();
  let w = waterLightP(Ld, amb);
  // reflection + glitter
  let R = seaReflDir(os, V);
  let refl = cloudRefl(skyRad(R), xz, R, amb);
  let Fr = fresnelW(max(dot(normalize(mix(nrm, vec3f(0.0, 1.0, 0.0), 0.45)), V), 0.0));
  let spec = seaSpec(os, V, Ld, sunE);
  // water body from the underwater optics (+ visible seafloor in shallow water)
  var body = seaBody(V, nrm, xz, w, true);
  // sunlight forward-scattered through the thin upper part of backlit crests
  let crest = clamp((in.crest - 0.05) / 0.9, 0.0, 1.0);
  let thin = pow(clamp(0.5 - 0.5 * dot(Ld, nrm), 0.0, 1.0), 3.0);
  body += w.sun0 * SIG_S * 9.0 * crest * crest * pow(max(dot(Ld, -V), 0.0), 4.0) * thin * exp(-dist / 600.0);
  // crest foam where the whole surface folds, with bubbly lace structure
  let cover = os.foam * (1.0 - smoothstep(300.0, 1500.0, dist));
  let pat = textureSample(foamLace, sRep, wpos * 0.23 + vec2f(0.013, 0.0) * tt).r * 0.78 + textureSample(foamLace, sRep, wpos * 0.71 + vec2f(0.37, 0.71)).g * 0.22;
  let fwp = fwidth(pat) + 0.03;
  let soft = 0.04 + 0.14 * (1.0 - cover);
  let foamMask = smoothstep(1.0 - cover - fwp - soft, 1.0 - cover + fwp + soft, pat) * smoothstep(0.0, 0.4, cover);
  body += SIG_S * 3.0 * (w.sun0 * 0.05 + w.amb0 * 0.35) * cover;     // bubbles under the foam
  let ambN = mix(amb, vec3f(dot(amb, vec3f(0.2126, 0.7152, 0.0722))), 0.85) / PI;
  let foamLit = vec3f(0.82, 0.87, 0.92) * (sunE * max(dot(nrm, Ld), 0.0) * 0.16 + ambN * 1.5);
  var col = body * (1.0 - Fr) + refl * Fr + spec;
  col = mix(col, foamLit, foamMask * 0.95);
  if (V.y < 0.0) { col = inscatter(vec3f(0.0, -0.5, 0.0), vec3f(0.0, -1.0, 0.0), 300.0, w, 1.0) * 0.5; }
  // aerial perspective through our own atmosphere
  let dW = normalize(in.rel.x * u.eastW.xyz + in.rel.y * u.upW.xyz + in.rel.z * u.northW.xyz);
  let h = max(u.camL.y, 0.5);
  let ar = atmo(h, dot(u.upW.xyz, dW), dot(u.upW.xyz, u.sunW.xyz), dot(dW, u.sunW.xyz), 0.0, dist, 1e30, 4, 0.5);
  col = ar.Lf * (SUN_E0 * u.extra.x) + ar.T * col;
  let alpha = u.planet.w * (1.0 - smoothstep(30000.0, 48000.0, in.r));
  return vec4f(col, alpha);
}

// ------------------------------------------------------------- underwater pass
fn detailH(xz: vec2f) -> f32 { return gn2(xz * 2.3) * 0.05 + gn2(xz * 5.7) * 0.02; }
fn terrH(xz: vec2f, t: f32) -> f32 {
  let s = terrSample(xz);
  var hh = s.x;
  if (s.w < 0.5 && s.y > 0.01) { hh += coral(xz).x * s.y; }
  if (s.w > 0.5) { hh += ventH(xz); }
  if (t < 16.0) { hh += detailH(xz) * (1.0 - smoothstep(9.0, 16.0, t)); }
  return hh;
}
fn coralPal(hue: f32) -> vec3f {
  var pal = array<vec3f, 6>(vec3f(0.95, 0.30, 0.22), vec3f(0.98, 0.62, 0.18), vec3f(0.62, 0.28, 0.75),
                            vec3f(0.98, 0.45, 0.62), vec3f(0.55, 0.78, 0.42), vec3f(0.95, 0.90, 0.72));
  return pal[min(u32(hue * 6.0), 5u)];
}
fn ventH(xz: vec2f) -> f32 {
  if (abs(xz.x - 3015.0) > 140.0 || abs(xz.y) > 140.0) { return 0.0; }
  var vents = array<vec4f, 3>(vec4f(2950.0, 30.0, 40.0, 13.0), vec4f(3015.0, -28.0, 28.0, 10.0), vec4f(3080.0, 45.0, 52.0, 15.0));
  var h = 0.0;
  for (var i = 0; i < 3; i++) {
    let v = vents[i];
    let d = length(xz - v.xy);
    let mound = v.z * 0.22 * pow(max(0.0, 1.0 - d / v.w), 2.0);
    let wob = gn2(xz * 0.9 + f32(i) * 7.0) * 0.9 + gn2(xz * 3.1) * 0.25;
    let stack = v.z * smoothstep(v.w * 0.34, v.w * 0.13, d + wob) * (0.9 + 0.1 * gn2(xz * 2.0));
    h += max(mound, stack);
  }
  return h;
}
// black-smoker plume density (x) and how close to the hot mouth it is (y)
fn plume(p: vec3f) -> vec2f {
  var vents = array<vec4f, 3>(vec4f(2950.0, 30.0, 40.0, 13.0), vec4f(3015.0, -28.0, 28.0, 10.0), vec4f(3080.0, 45.0, 52.0, 15.0));
  var dsum = 0.0; var hot = 0.0;
  for (var i = 0; i < 3; i++) {
    let v = vents[i];
    let top = terrSample(v.xy).x + v.z * 0.92;
    let rel = p.y - top;
    if (rel > -1.0 && rel < 90.0) {
      let tm = u.misc.x;
      let drift = vec2f(sin(rel * 0.06 + tm * 0.2), cos(rel * 0.05 + tm * 0.15)) * rel * 0.12;
      let dv = p.xz - v.xy - drift;
      let R = 0.7 + max(rel, 0.0) * 0.2;
      let turb = gn2(vec2f(dv.x * 0.6 + rel * 0.15, dv.y * 0.6 - tm * 1.2 + rel * 0.25)) * 0.5 + 0.5;
      let d = exp(-dot(dv, dv) / (R * R)) * (0.45 + 0.8 * turb) * smoothstep(-1.0, 1.0, rel) * (1.0 - smoothstep(40.0, 90.0, rel));
      dsum += d;
      hot += d * exp(-max(rel, 0.0) * 0.18);
    }
  }
  return vec2f(dsum, hot);
}
fn ventDist(xz: vec2f) -> f32 {
  let a = length(xz - vec2f(2950.0, 30.0)) - 6.0;
  let b = length(xz - vec2f(3015.0, -28.0)) - 5.0;
  let c = length(xz - vec2f(3080.0, 45.0)) - 7.0;
  return min(a, min(b, c));
}
fn ventGlow(p: vec3f) -> vec3f {
  var vents = array<vec4f, 3>(vec4f(2950.0, 30.0, 40.0, 13.0), vec4f(3015.0, -28.0, 28.0, 10.0), vec4f(3080.0, 45.0, 52.0, 15.0));
  var g = vec3f(0.0);
  for (var i = 0; i < 3; i++) {
    let v = vents[i];
    let d = length(p.xz - v.xy) / v.w;
    if (d < 0.25) {
      let top = terrSample(v.xy).x + v.z * 0.85;
      let mouth = exp(-d * d * 80.0) * smoothstep(top - 4.0, top, p.y);
      let flick = 0.75 + 0.25 * sin(u.misc.x * 3.0 + f32(i) * 2.0 + p.y * 0.7);
      g += vec3f(1.0, 0.36, 0.08) * mouth * 0.03 * flick;
    }
  }
  return g;
}
struct FO { @location(0) col: vec4f, @builtin(frag_depth) depth: f32 };
@fragment fn fsUnder(@builtin(position) fc: vec4f) -> FO {
  let rd = viewRayL(fc.xy);
  let c = u.camL.xyz;
  let w = waterLight();
  let jit = ign(fc.xy);
  var tS = 1e9;
  if (rd.y > 1e-4) { tS = -c.y / rd.y; }
  let tMaxV = 240.0;
  let tLim = min(tS, tMaxV);
  var t = 0.05; var tPrev = 0.0; var hit = false;
  for (var i = 0; i < 200; i++) {
    let p = c + rd * t;
    let dy = p.y - terrH(p.xz, t);
    if (dy < 0.0015 * t) { hit = true; break; }
    tPrev = t;
    var stp = max(dy * 0.5, 0.01 + t * 0.003);
    if (p.y < -2900.0) { stp = min(stp, max(ventDist(p.xz) * 0.8, 0.2)); }
    t += stp;
    if (t > tLim) { break; }
  }
  if (hit) {
    var lo = tPrev; var hi = t;
    for (var k = 0; k < 6; k++) {
      let mid = 0.5 * (lo + hi);
      let p = c + rd * mid;
      if (p.y - terrH(p.xz, mid) < 0.0) { hi = mid; } else { lo = mid; }
    }
    t = hi;
  }
  var surfCol = vec3f(0.0);
  var tEnd = tMaxV;
  var depthT = 0.0;
  if (hit) {
    tEnd = t; depthT = t;
    let p = c + rd * t;
    let e = max(0.03, t * 0.002);
    let hx = terrH(p.xz + vec2f(e, 0.0), t) - terrH(p.xz - vec2f(e, 0.0), t);
    let hz = terrH(p.xz + vec2f(0.0, e), t) - terrH(p.xz - vec2f(0.0, e), t);
    var N = normalize(vec3f(-hx, 2.0 * e, -hz));
    let ts = terrSample(p.xz);
    let z = -p.y;
    let slope = 1.0 - N.y;
    let nz = gn2(p.xz * 0.35) * 0.5 + 0.5;
    var alb = mix(vec3f(0.66, 0.60, 0.46), vec3f(0.56, 0.52, 0.42), nz);
    alb = mix(alb, vec3f(0.30, 0.28, 0.25), smoothstep(120.0, 600.0, z));
    let rockW = smoothstep(0.3, 0.6, slope);
    if (rockW > 0.0) {
      let q1 = vec2f(p.x + p.z, p.y) * 0.7; let q2 = vec2f(p.x - p.z, p.y * 1.3) * 2.3;
      let rn = fbm2(q1, 4) * 0.5 + 0.5;
      let strata = sin(p.y * 1.7 + fbm2(q1 * 0.3, 2) * 4.0) * 0.5 + 0.5;
      var rc = mix(vec3f(0.16, 0.14, 0.12), vec3f(0.34, 0.30, 0.25), rn) * (0.8 + 0.3 * strata);
      rc *= 0.85 + 0.3 * (fbm2(q2 * 2.7, 3) * 0.5 + 0.5);
      alb = mix(alb, rc, rockW);
      if (t < 60.0) {
        let bx = fbm2(q2, 3); let by = fbm2(q2 + 17.0, 3);
        let tg = normalize(vec3f(-N.z, 0.0, N.x) + vec3f(1e-4, 0.0, 0.0));
        N = normalize(N + (tg * bx + vec3f(0.0, 1.0, 0.0) * by * 0.7 + N * strata * 0.0) * 0.55 * rockW * (1.0 - smoothstep(25.0, 60.0, t)));
      }
    }
    // sand ripples
    if (t < 30.0 && slope < 0.3 && ts.y < 0.3) {
      let rp = p.xz + vec2f(gn2(p.xz * 0.2), gn2(p.xz * 0.2 + 7.0)) * 1.5;
      let ripple = cos(rp.x * 7.0 + rp.y * 2.0);
      N = normalize(N + vec3f(sin(rp.x * 7.0 + rp.y * 2.0) * 0.12, 0.0, 0.03) * (1.0 - smoothstep(10.0, 30.0, t)));
      alb *= 0.95 + 0.05 * ripple;
    }
    // coral
    if (ts.w < 0.5 && ts.y > 0.01) {
      let cr = coral(p.xz);
      let cwt = cr.y * ts.y;
      if (cwt > 0.01) {
        var cc = coralPal(cr.z);
        let pv = vor1(p.xz * 26.0 + p.y * 9.0);
        let pol = 0.7 + 0.45 * smoothstep(0.15, 0.45, pv.x);
        cc *= pol * (0.85 + 0.3 * (gn2(p.xz * 3.0 + p.y) * 0.5 + 0.5));
        if (t < 25.0) {
          let b = vec2f(gn2(p.xz * 11.0 + p.y * 4.0), gn2(p.xz * 11.0 + 31.0 + p.y * 4.0));
          N = normalize(N + vec3f(b.x, 0.0, b.y) * 0.22 * (1.0 - smoothstep(10.0, 25.0, t)) * cwt);
        }
        alb = mix(alb, cc, smoothstep(0.05, 0.4, cwt));
      }
    }
    // abyssal manganese nodules
    if (z > 2500.0) {
      let q = p.xz * 3.2; let iq = vec2i(floor(q)); let fq = fract(q);
      let hh = hash22(iq);
      let rr = 0.12 + 0.16 * hh.y;
      let off = fq - (0.3 + 0.4 * hh) + vec2f(gn2(p.xz * 9.0), gn2(p.xz * 9.0 + 5.0)) * 0.05;
      let dd = length(off);
      if (hh.x > 0.62 && dd < rr) {
        alb = vec3f(0.05, 0.045, 0.04) * (0.8 + 0.4 * hh.y);
        N = normalize(N + vec3f(off.x, 0.0, off.y) / rr * 1.2);
      }
    }
    var emis = vec3f(0.0);
    if (z > 3000.0) {
      emis = ventGlow(p) * exp(SIG_T * t * vec3f(0.6, 0.25, 0.0));
      if (ventH(p.xz) > 3.0) { alb = vec3f(0.09, 0.075, 0.065) * (0.7 + 0.6 * (gn2(vec2f(p.x + p.z, p.y) * 1.7) * 0.5 + 0.5)); }
    }
    // lighting
    let sunZ = w.sun0 * exp(-KD * z * w.kS);
    let ambZ = w.amb0 * exp(-KD * z);
    var caus = 1.0;
    if (z < 70.0) {
      let ps = p.xz - w.sunU.xz * (p.y / w.sunU.y);
      caus = mix(1.0, 0.25 + 2.3 * caustic(ps * 0.6, u.misc.x * 1.1), exp(-z / 22.0));
    }
    let ao = saturate(0.35 + 0.65 * saturate(1.0 - (terrSample(p.xz + vec2f(1.2, 0.7)).x + terrSample(p.xz - vec2f(0.8, 1.1)).x - 2.0 * p.y) * 0.35));
    var lit = sunZ * max(dot(N, -w.sunU), 0.0) * caus + ambZ * (0.55 + 0.45 * N.y) * ao;
    let lv = p - lampPos();
    lit += lampIrr(lv) * max(dot(N, -normalize(lv)), 0.0);
    surfCol = alb / PI * lit + emis;
  } else if (tS < tMaxV) {
    tEnd = tS; depthT = tS;
    let ps = c + rd * tS;
    let o = ps.xz - c.xz;
    // seen from below the surface reads calmer: skip the finest ripples, widen the footprint a little
    let fpU = max(tS * u.proj.w, 0.03) * 1.6;
    let os = sampleOceanG(o, vec2f(fpU, 0.0), vec2f(0.0, fpU), 0.6, 5);
    let N = normalize(vec3f(-os.s.x, 1.0, -os.s.y));
    let tr = refract(rd, -N, 1.333);
    let rr = reflect(rd, -N);
    let below = w.amb0 * vec3f(0.0035, 0.018, 0.03);
    if (dot(tr, tr) < 1e-6) {
      surfCol = below;
    } else {
      let F = fresnelW(dot(tr, N));
      let amb = skyAmb();
      var sky = skyRad(tr) + sunDisk(tr, u.sunL.xyz) * sunTrans(0.0, u.sunL.y) * 0.05;
      sky = cloudRefl(sky, o, tr, amb);
      surfCol = sky * (1.0 - F) * 1.6 + F * below;
    }
    surfCol = mix(surfCol, w.amb0 * 0.25, saturate(os.foam * 0.5));
  }
  // volumetric: shafts + lamp + (plain analytic in-scatter)
  let NS = 14;
  let segEnd = min(tEnd, 140.0);
  var shA = 0.0; var shW = 0.0; var lampS = vec3f(0.0);
  let lp = lampPos();
  for (var i = 0; i < NS; i++) {
    let x0 = f32(i) / f32(NS); let x1 = f32(i + 1) / f32(NS);
    let s0 = segEnd * x0 * x0; let s1 = segEnd * x1 * x1;
    let s = mix(s0, s1, jit);
    let p = c + rd * s;
    if (p.y < 0.0) {
      let wgt = exp(-(SIG_T.g - KD.g * w.kS * rd.y) * s) * (s1 - s0);
      shA += wgt * shaftAt(p, w); shW += wgt;
    }
  }
  // lamp beam + black-smoker plumes: uniform steps over the first 60 m
  var odP = 0.0; var plumeL = vec3f(0.0);
  let nearVents = c.y < -2900.0 && abs(c.x - 3015.0) < 220.0 && abs(c.z) < 220.0;
  if (u.water.x > 0.01 || nearVents) {
    let lEnd = min(tEnd, 60.0);
    let ds = lEnd / 28.0;
    for (var i = 0; i < 28; i++) {
      let s = (f32(i) + jit) * ds;
      let p = c + rd * s;
      let lv = p - lp;
      let ph = 0.6 * hg(dot(normalize(lv), -rd), 0.75) + 0.4 / (4.0 * PI);
      let li = lampIrr(lv);
      lampS += li * ph * exp(-SIG_T * s) * ds * smoothstep(0.8, 4.0, s) * exp(-odP);
      if (nearVents) {
        let pl = plume(p);
        if (pl.x > 0.002) {
          let att = exp(-odP) * exp(-SIG_T * s);
          plumeL += att * pl.x * ds * (li * 0.02 + vec3f(1.0, 0.36, 0.08) * pl.y / max(pl.x, 1e-3) * 0.004 * exp(SIG_T * s * vec3f(0.75, 0.35, 0.0)));
          odP += pl.x * ds * 0.45;
        }
      }
    }
  }
  let shaftM = select(1.0, shA / shW, shW > 0.0);
  let insc = inscatter(c, rd, tEnd, w, shaftM) + SIG_S * lampS * 0.02;
  var out: FO;
  out.col = vec4f(insc * mix(1.0, exp(-odP), 0.7) + plumeL * 0.15 + exp(-SIG_T * tEnd) * surfCol * exp(-odP), 1.0);
  out.depth = select(0.0, u.proj.z / max(depthT * dot(rd, u.fwdL.xyz), u.proj.z), depthT > 0.0);
  return out;
}

// ------------------------------------------------------------- fish
struct FV { @builtin(position) pos: vec4f, @location(0) n: vec3f, @location(1) wp: vec3f, @location(2) prm: vec2f, @location(3) @interpolate(flat) sch: u32 };
@vertex fn vsFish(@location(0) a: vec4f, @location(1) b: vec4f, @builtin(instance_index) iid: u32) -> FV {
  let f = fish[iid];
  let sch = u32(f.v.w);
  var sizes = array<f32, 4>(0.20, 0.16, 0.30, 0.55);
  let size = sizes[sch & 3u] * (0.85 + 0.3 * fract(f.p.w * 7.31));
  var lp = a.xyz;
  let spd = length(f.v.xyz);
  let ph = f.p.w * 6.28 + u.misc.x * (5.0 + spd * 5.0);
  let tail = pow(saturate(0.55 - lp.z), 2.0);
  lp.x += sin(ph - lp.z * 6.0) * 0.16 * tail;
  let fw = normalize(f.v.xyz + vec3f(0.0, 0.0, 1e-4));
  var rt = cross(vec3f(0.0, 1.0, 0.0), fw);
  if (length(rt) < 1e-3) { rt = vec3f(1.0, 0.0, 0.0); }
  rt = normalize(rt);
  let upv = cross(fw, rt);
  let wpos = f.p.xyz + (rt * lp.x + upv * lp.y + fw * lp.z) * size;
  var out: FV;
  out.pos = projL(wpos - u.camL.xyz);
  out.n = normalize(rt * b.x + upv * b.y + fw * b.z);
  out.wp = wpos; out.prm = vec2f(a.w, b.w); out.sch = sch;
  return out;
}
@fragment fn fsFish(in: FV) -> @location(0) vec4f {
  let w = waterLight();
  let c = u.camL.xyz;
  let dv = in.wp - c; let dist = length(dv); let rd = dv / dist;
  var N = normalize(in.n);
  if (dot(N, rd) > 0.0) { N = -N; }
  let z = max(-in.wp.y, 0.0);
  let up = smoothstep(-0.3, 0.5, in.n.y);
  var back = vec3f(0.10, 0.22, 0.36); var belly = vec3f(0.78, 0.80, 0.82);
  if (in.sch == 1u) { back = vec3f(0.95, 0.72, 0.08); belly = vec3f(0.98, 0.85, 0.25); }
  else if (in.sch == 2u) {
    back = vec3f(0.78, 0.80, 0.55); belly = vec3f(0.85, 0.86, 0.75);
    if (fract(in.prm.x * 5.0) < 0.35) { back *= 0.12; belly *= 0.15; }
  } else if (in.sch == 3u) { back = vec3f(0.24, 0.29, 0.34); belly = vec3f(0.70, 0.72, 0.74); }
  var alb = mix(belly, back, up);
  if (in.prm.y > 0.5) { alb *= 0.8; }
  let sunZ = w.sun0 * exp(-KD * z * w.kS);

struct PV { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec3f };
@vertex fn vsPart(@builtin(vertex_index) vid: u32, @builtin(instance_index) iid: u32) -> PV {

  let corner = corners[vid];

  let hh2 = hash33(vec3i(i32(iid), 91, 3));
  let BOX = 26.0;
  let c = u.camL.xyz;
  let tm = u.misc.x;
  let p = hh * BOX + vec3f(sin(tm * 0.3 + hh2.x * 6.28) * 0.3, -tm * 0.03 * (0.5 + hh2.y), cos(tm * 0.25 + hh2.z * 6.28) * 0.3);
  let rel = fract((p - c) / BOX) * BOX - vec3f(BOX * 0.5);

  let w = waterLight();
  var size = 0.006 + 0.012 * hh2.z;

  if (isBio) {
    size = 0.018 + 0.03 * hh2.y;
    let bioAmt = smoothstep(140.0, 380.0, depth);
    let pulse = 0.5 + 0.5 * sin(tm * (0.8 + hh2.y * 2.0) + hh.x * 40.0);
    let disturb = smoothstep(5.0, 0.6, dist) * saturate(u.water.y * 0.25);
    let tint = select(vec3f(0.12, 0.8, 1.0), vec3f(0.3, 1.0, 0.5), hh2.z > 0.65);

  let minS = dist * u.proj.w * 0.8;
  if (size < minS) { col *= (size * size) / (minS * minS); size = minS; }
  let wpos = wp + (u.rightL.xyz * corner.x + u.upCL.xyz * corner.y) * size;
  var out: PV;
  out.pos = projL(wpos - c);

}
@fragment fn fsPart(in: PV) -> @location(0) vec4f {
  let r2 = dot(in.uv, in.uv);
  let a = exp(-r2 * 3.5) * (1.0 - smoothstep(0.8, 1.0, r2));
  return vec4f(in.col * a, 0.0);
}

// ------------------------------------------------------------- jellyfish (deep, glowing)
struct JV { @builtin(position) pos: vec4f, @location(0) col: vec3f, @location(1) rim: f32 };
@vertex fn vsJelly(@location(0) a: vec4f, @location(1) b: vec4f, @builtin(instance_index) iid: u32) -> JV {
  let hh = hash33(vec3i(i32(iid), 5, 77));

  let c2 = vec2f(sz.x - dxdx.y, sz.y + dxdx.x);
  let c3 = vec2f(dzdz.x - dxdz.y, dzdz.y + dxdz.x);
  data[(c * 2u) * N * N + m * N + n] = vec4f(c0, c1);

fn fftCore(lid: u32, base: u32, stride: u32) {

  for (var p = 1u; p < 256u; p = p << 1u) {

const t = k => I18N[LANG][k] ?? I18N.en[k] ?? k;
const LOCALE = () => (LANG === 'tr' ? 'tr-TR' : 'en-US');
function applyStaticLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-num]').forEach(el => {
    const [num, unit] = el.dataset.num.split(' '); const v = Math.abs(parseFloat(num));
    el.textContent = v.toLocaleString(LOCALE(), { maximumFractionDigits: 1 }) + ' ' + unit;
  });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
}
applyStaticLang();
// the whole world is this one file: show its size (measured from the file itself when served over http)
(async () => {
  let b = 0;
  try { if (location.protocol.startsWith('http')) b = (await (await fetch(location.pathname, { cache: 'no-store' })).blob()).size; } catch (e) { /* offline */ }
  if (!b) b = new Blob(['<!doctype html>\n' + document.documentElement.outerHTML]).size;
  const txt = Math.round(b / 1000).toLocaleString(LOCALE()) + ' KB';
  document.querySelectorAll('.fileKB').forEach(el => { el.textContent = txt; });
})();

// which layer the camera is in (the abyss card needs the seafloor nearby)
function layerAt(alt, floorDist, onWall) {
  if (onWall && alt < -30 && alt > -1300) return 'wall';
  if (alt < -1000) return (alt < -2500 && floorDist < 300) ? 'abyss' : 'midnight';
  for (const L of LAYERS) if (!L.place && alt <= L.top && alt > L.bot) return L.id;
  return alt > 0 ? 'orbit' : 'abyss';
}
// live readings from simple physical models
const KD_BLUE = (0.030 + 0.030) * 1.08;   // same downwelling attenuation as the underwater renderer
function pressureAtm(alt) { return alt >= 0 ? Math.exp(-alt / 7600) : 1 + (-alt) / 10.06; }
function temperatureC(alt) {
  if (alt < 0) return 2 + 24 * Math.exp(alt / 280);             // tropical surface 26 °C, ~2 °C deep
  const h = alt / 1000;
  if (h < 20) return Math.max(27 - 6.5 * h, -56.5);   // tropical dive site: ~27 °C at sea level
  if (h < 32) return -56.5 + (h - 20);
  if (h < 47) return -44.5 + 2.8 * (h - 32);
  if (h < 51) return -2.5;
  if (h < 71) return -2.5 - 2.8 * (h - 51);
  if (h < 86) return -58.5 - 2.0 * (h - 71);
  return -88.5 + 900 * (1 - Math.exp(-(h - 86) / 80));          // thermosphere heats up with height
}

const canvas = $('#c');
const msg = (t) => { $('#msgs').textContent = t; };
function fail(t) { msg(t); $('#msg').classList.remove('hide'); throw new Error(t); }

async function main() {
  msg(t('m_init'));
  if (!navigator.gpu) fail(t('e_nogpu'));
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) fail(t('e_noadapter'));
  // ?prof: per-pass GPU timings via timestamp queries (shown in the stats line)
  const PROF = new URLSearchParams(location.search).has('prof') && adapter.features.has('timestamp-query');
  const device = await adapter.requestDevice({ requiredFeatures: PROF ? ['timestamp-query'] : [] });
  let gpuError = null;
  device.addEventListener('uncapturederror', e => { if (!gpuError) { gpuError = e.error.message; console.error(e.error.message); } });
  device.lost.then(i => fail(t('e_lost') + i.message));
  const prof = PROF ? {
    qs: device.createQuerySet({ type: 'timestamp', count: 12 }),
    res: device.createBuffer({ size: 96, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC }),
    rb: device.createBuffer({ size: 96, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }),
    busy: false, pending: null, avg: null,
  } : null;
  const ctx = canvas.getContext('webgpu');
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: fmt, alphaMode: 'opaque' });

  async function mod(code, label) {
    const m = device.createShaderModule({ code, label });
    const info = await m.getCompilationInfo();
    const errs = info.messages.filter(x => x.type === 'error');
    if (errs.length) {
      const lines = code.split('\n');
      const txt = errs.map(e => `${label}:${e.lineNum}:${e.linePos} ${e.message}\n   ${lines[e.lineNum - 1]}`).join('\n');
      console.error(txt); fail(t('e_shader') + ' (' + label + '): ' + errs[0].message);
    }
    return m;
  }
  const TU = GPUTextureUsage, BU = GPUBufferUsage;
  const tex = d => device.createTexture(d);
  const buf = (size, usage, data) => {
    const b = device.createBuffer({ size, usage, mappedAtCreation: !!data });
    if (data) { new data.constructor(b.getMappedRange()).set(data); b.unmap(); }
    return b;
  };
  const cpl = (module, entryPoint = 'main') => device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint } });
  const bg = (pipe, entries, i = 0) => device.createBindGroup({ layout: pipe.getBindGroupLayout(i), entries: entries.map((r, k) => ({ binding: k, resource: r })) });

  msg(t('m_compile'));
  const [mFoamLace, mMip8] = await Promise.all([mod(FOAMLACE_WGSL, 'foamlace'), mod(RGBA8MIP_WGSL, 'mip8')]);
  const [mRender, mTrans, mSky, mMap, mNoise, mBake, mSpec, mFFT, mAsm, mMip, mBoids, mPost] = await Promise.all([
    mod(RENDER_WGSL, 'render'), mod(TRANS_WGSL, 'transmittance'), mod(SKYVIEW_WGSL, 'skyview'), mod(MAPGEN_WGSL, 'mapgen'),
    mod(NOISE3D_WGSL, 'noise3d'), mod(TERRBAKE_WGSL, 'terrain'), mod(SPECTRUM_WGSL, 'spectrum'), mod(FFT_WGSL, 'fft'),
    mod(ASSEMBLE_WGSL, 'assemble'), mod(MIPGEN_WGSL, 'mipgen'), mod(BOIDS_WGSL, 'boids'), mod(POST_WGSL, 'post')]);

  // ------------------------------------------------------------ static resources
  const samp = {
    rep: device.createSampler({ addressModeU: 'repeat', addressModeV: 'repeat', addressModeW: 'repeat', magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear', maxAnisotropy: 16 }),
    clamp: device.createSampler({ magFilter: 'linear', minFilter: 'linear' }),
    mix: device.createSampler({ addressModeU: 'repeat', magFilter: 'linear', minFilter: 'linear' }),
  };
  const transLUT = tex({ size: [256, 64], format: 'rgba16float', usage: TU.STORAGE_BINDING | TU.TEXTURE_BINDING });
  const skyLUT = tex({ size: [256, 128], format: 'rgba16float', usage: TU.STORAGE_BINDING | TU.TEXTURE_BINDING });
  const mapTex = tex({ size: [2048, 1024], format: 'rgba16float', usage: TU.STORAGE_BINDING | TU.TEXTURE_BINDING });
  const noiseTex = tex({ size: [64, 64, 64], dimension: '3d', format: 'rgba8unorm', usage: TU.STORAGE_BINDING | TU.TEXTURE_BINDING });
  const OMIPS = 9;
  const oceanTex = tex({ size: [N, N, NCAS * 3], format: 'rgba16float', mipLevelCount: OMIPS, usage: TU.STORAGE_BINDING | TU.TEXTURE_BINDING });
  const LACE_MIPS = 10;
  const foamLace = tex({ size: [512, 512], format: 'rgba8unorm', mipLevelCount: LACE_MIPS, usage: TU.STORAGE_BINDING | TU.TEXTURE_BINDING });
  const terr = [
    { span: REEF_SPAN, size: 2048 }, { span: MID_SPAN, size: 2048 }, { span: FAR_SPAN, size: 1024 },
  ].map(t => ({ ...t, tex: tex({ size: [t.size, t.size], format: 'rgba16float', usage: TU.STORAGE_BINDING | TU.TEXTURE_BINDING | TU.COPY_SRC }) }));

  const UVEC = 24;
  const uBuf = buf(UVEC * 16, BU.UNIFORM | BU.COPY_DST);
  const uData = new Float32Array(UVEC * 4);
  const opBuf = buf(48, BU.UNIFORM | BU.COPY_DST);
  const opData = new Float32Array([0, 1.25, 0, 0, ...CAS.map(c => c.L), 0, 0]);
  const h0Buf = buf(NCAS * N * N * 16, BU.STORAGE, buildH0());
  const dataBuf = buf(NCAS * 2 * N * N * 16, BU.STORAGE);

  // fish
  const fishInit = new Float32Array(NFISH * 8);
  { const r = mulberry32(7); for (let i = 0; i < NFISH; i++) { fishInit.set([(r() - 0.5) * 20, -8 - r() * 6, (r() - 0.5) * 20, r(), r() - 0.5, 0, r() - 0.5, i % 4], i * 8); } }
  const fishA = buf(NFISH * 32, BU.STORAGE | BU.COPY_DST, fishInit);
  const fishB = buf(NFISH * 32, BU.STORAGE | BU.COPY_SRC);
  const fishVerts = fishMesh(), jellyVerts = jellyMesh();
  const fishVBuf = buf(fishVerts.byteLength, BU.VERTEX, fishVerts);
  const jellyVBuf = buf(jellyVerts.byteLength, BU.VERTEX, jellyVerts);
  // ocean ring mesh indices
  const RINGS = 760, SEGS = 512;
  const idx = new Uint32Array((RINGS - 1) * SEGS * 6);
  { let k = 0; for (let i = 0; i < RINGS - 1; i++) for (let j = 0; j < SEGS; j++) {
    const a = i * SEGS + j, b = i * SEGS + (j + 1) % SEGS, c = (i + 1) * SEGS + j, d = (i + 1) * SEGS + (j + 1) % SEGS;
    idx[k++] = a; idx[k++] = c; idx[k++] = b; idx[k++] = b; idx[k++] = c; idx[k++] = d; } }
  const idxBuf = buf(idx.byteLength, BU.INDEX, idx);

  // ------------------------------------------------------------ one-time generation
  msg(t('m_gen'));
  const G = norm(dirLatLon(8 * D2R, -150 * D2R));   // dive site (planet frame)
  {
    const pTrans = cpl(mTrans), pMap = cpl(mMap), pNoise = cpl(mNoise), pBake = cpl(mBake);
    const gpBuf = buf(16, BU.UNIFORM, new Float32Array([...G, 0]));
    const enc = device.createCommandEncoder();
    const cp = enc.beginComputePass();
    cp.setPipeline(pTrans); cp.setBindGroup(0, bg(pTrans, [transLUT.createView()])); cp.dispatchWorkgroups(32, 8);
    cp.setPipeline(pMap); cp.setBindGroup(0, bg(pMap, [mapTex.createView(), { buffer: gpBuf }])); cp.dispatchWorkgroups(256, 128);
    cp.setPipeline(pNoise); cp.setBindGroup(0, bg(pNoise, [noiseTex.createView()])); cp.dispatchWorkgroups(16, 16, 16);
    const pLace = cpl(mFoamLace), pMip8 = cpl(mMip8);
    cp.setPipeline(pLace); cp.setBindGroup(0, bg(pLace, [foamLace.createView({ baseMipLevel: 0, mipLevelCount: 1 })])); cp.dispatchWorkgroups(64, 64);
    cp.setPipeline(pMip8);
    for (let m = 1; m < LACE_MIPS; m++) {
      const sz = Math.max(1, 512 >> m);
      cp.setBindGroup(0, bg(pMip8, [foamLace.createView({ baseMipLevel: m - 1, mipLevelCount: 1 }), foamLace.createView({ baseMipLevel: m, mipLevelCount: 1 })]));
      cp.dispatchWorkgroups(Math.ceil(sz / 8), Math.ceil(sz / 8));
    }
    for (const t of terr) {
      const b = buf(16, BU.UNIFORM, new Float32Array([t.span, t.size, t.span / t.size, 0]));
      cp.setPipeline(pBake); cp.setBindGroup(0, bg(pBake, [t.tex.createView(), { buffer: b }])); cp.dispatchWorkgroups(t.size / 8, t.size / 8);
    }
    cp.end();
    // read back mid + far heights for camera collision
    for (const t of terr.slice(1)) {
      t.rb = device.createBuffer({ size: t.size * t.size * 8, usage: BU.COPY_DST | BU.MAP_READ });
      enc.copyTextureToBuffer({ texture: t.tex }, { buffer: t.rb, bytesPerRow: t.size * 8 }, [t.size, t.size]);
    }
    device.queue.submit([enc.finish()]);
    for (const t of terr.slice(1)) {
      await t.rb.mapAsync(GPUMapMode.READ);
      const u16 = new Uint16Array(t.rb.getMappedRange());
      const hgt = new Float32Array(t.size * t.size);
      for (let i = 0; i < hgt.length; i++) hgt[i] = f16(u16[i * 4]) + f16(u16[i * 4 + 1]);
      t.cpu = hgt; t.rb.unmap(); t.rb.destroy();

      sound.update({ alt, under, speed: S.camSpeed, floorDist: under ? alt - floorH : 1e9, ventDist: under && alt < -2800 ? vd : 1e9, dt });
    }

    // ---------- HUD
    uiT += dt;
    if (uiT > 0.1) {
      uiT = 0;
      let onWall = false;
      if (under && alt < -30) {
        const r = 30, hs = [cpuTerr(loc[0] + r, loc[2]), cpuTerr(loc[0] - r, loc[2]), cpuTerr(loc[0], loc[2] + r), cpuTerr(loc[0], loc[2] - r), floorH];
        onWall = Math.max(...hs) - Math.min(...hs) > 70 && Math.max(...hs) > alt - 400;   // > ~1:1 slope, and the face is near
      }
      guide.update(alt, under ? alt - floorH : 1e9, sunSin, now / 1000, onWall);
      const [ph, sb] = phaseOf(alt, alt - floorH);
      $('#phase').textContent = ph; $('#phasesub').textContent = sb;
      $('#rk').textContent = under ? t('depth') : t('altitude');
      $('#rv').textContent = fmtAlt(alt);
      $('#mark').style.top = gY(alt) + '%';
      const hrs = hoursAt(S.P, S.psi);
      $('#clock').textContent = fmtClock(hrs); $('#dockClock').textContent = fmtClock(hrs);
      $('#bLamp').style.display = under ? '' : 'none';
      $('#clockName').textContent = clockName(hrs, Math.asin(clamp(sunSin, -1, 1)) / D2R);
      $('#stats').textContent = `${fpsShow.toFixed(0)} fps · ${W}×${H}` + (under ? ` · ${t('to_floor')} ${fmtAlt(alt - floorH)}` : '');
      if (prof && prof.avg) {
        const a = prof.avg, tot = a.reduce((x, y) => x + y, 0);
        $('#stats').textContent += ` · GPU ${tot.toFixed(1)} ms [FFT ${a[0].toFixed(2)} LUT ${a[2].toFixed(2)} gök/su altı ${a[3].toFixed(2)} ağ ${a[4].toFixed(2)} post ${a[5].toFixed(2)}]`;
      }
    }
  }
  requestAnimationFrame(frame);
  window.__bp = { S, goPreset, toLocal, cpuTerr, sound, prof };
}
main().catch(e => { console.error(e); $('#msg').classList.remove('hide'); });
</script>
</body>
